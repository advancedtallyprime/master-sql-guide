<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 40" width="172" height="40" fill="none">
  <!-- Dynamic 4-color G-TEC Emblem -->
  <g transform="translate(4, 3)">
    <!-- Blue Upper Blade -->
    <path d="M17 2 C24 2, 30 7, 31 14 C27 12, 22 13, 18 16 C17 11, 19 6, 17 2 Z" fill="#0878B8"/>
    <!-- Orange Right Blade -->
    <path d="M32 17 C32 24, 27 30, 20 31 C22 27, 21 22, 18 18 C23 17, 28 19, 32 17 Z" fill="#F47A21"/>
    <!-- Green Lower Blade -->
    <path d="M17 32 C10 32, 4 27, 3 20 C7 22, 12 21, 16 18 C17 23, 15 28, 17 32 Z" fill="#8BC53F"/>
    <!-- Teal Left Blade -->
    <path d="M2 17 C2 10, 7 4, 14 3 C12 7, 13 12, 16 16 C11 17, 6 15, 2 17 Z" fill="#00A99D"/>
    <!-- Central Core -->
    <circle cx="17" cy="17" r="4.5" fill="#0878B8"/>
    <circle cx="17" cy="17" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <!-- G-TEC Bold Wordmark -->
  <text x="46" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" fill="#0878B8" letter-spacing="-0.5">G-TEC</text>
  
  <!-- Subtle Divider -->
  <line x1="104" y1="9" x2="104" y2="31" stroke="#DCE7EE" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Jain Keerti Education Stacked -->
  <text x="111" y="18" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="8.5" fill="#111111" letter-spacing="0.5">JAIN KEERTI</text>
  <text x="111" y="28" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" fill="#5F6368" letter-spacing="0.8">EDUCATION</text>
</svg>
